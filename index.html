  <script>
    const wedding=new Date("2026-11-15T11:30:00+08:00");
    const box=document.getElementById("countdown");
    function tick(){
      const diff=wedding.getTime()-Date.now();
      if(diff<0){box.innerHTML='<div class="count-box" style="grid-column:1/-1"><b>TODAY</b><span>今天</span></div>';return;}
      const parts=[Math.floor(diff/86400000),Math.floor(diff%86400000/3600000),Math.floor(diff%3600000/60000),Math.floor(diff%60000/1000)];
      const labels=["天","時","分","秒"];
      box.innerHTML=parts.map((n,i)=>`<div class="count-box"><b>${n}</b><span>${labels[i]}</span></div>`).join("");
    }
    tick();setInterval(tick,1000);
  </script>

    function tname(t){return t==8?'主桌 8':t+' 桌'}
    function pick(g){
      var mates=D.guests.filter(function(x){return x.table==g.table&&x!==g});
      r.hidden=false;r.innerHTML='<div class="result"><p>'+esc(label(g))+(g.aliases.length?'（'+esc(g.aliases.join('、'))+'）':'')+'</p><b>'+tname(g.table)+'</b><p>'+g.zone+' 用餐區・'+esc(g.cat||'')+'</p>'+(mates.length?'<div class="mates">'+mates.map(function(m){return '<span>'+esc(label(m))+'</span>'}).join('')+'</div>':'')+'</div>';
      document.querySelectorAll('.tb.on').forEach(function(e){e.classList.remove('on')});var el=document.getElementById('tb-'+g.table);if(el)el.classList.add('on');
      c.innerHTML='';r.scrollIntoView({behavior:'smooth',block:'start'})}
    function btn(g,sub){var b=document.createElement('button');b.type='button';b.innerHTML='<span>'+esc(label(g))+'</span><small>'+esc(sub)+'</small>';b.onclick=function(){pick(g)};return b}
    fetch('./seats.json').then(function(x){return x.json()}).then(function(d){D=d;
      q.addEventListener('input',function(){c.innerHTML='';SeatSearch.search(D.guests,q.value).forEach(function(g){var li=document.createElement('li');li.appendChild(btn(g,tname(g.table)+'・'+g.cat));c.appendChild(li)});if(q.value&&!c.children.length)c.innerHTML='<li class="hint" style="font-size:13px;color:var(--ink-soft);text-align:center">找不到，試試只打一個字或英文名</li>'})});
  })();
  </script>
</body>
</html>
