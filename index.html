<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>馬躍成 & 楊雅婷 婚禮邀請｜2026.11.15</title>
  <meta name="description" content="2026.11.15（日）11:30｜VVG Food Play & Bar｜臺中國家歌劇院 5F" />
  <meta name="theme-color" content="#f6efe8" />
  <meta property="og:title" content="馬躍成 & 楊雅婷 婚禮邀請" />
  <meta property="og:description" content="2026.11.15（日）11:30｜VVG Food Play & Bar｜臺中國家歌劇院 5F" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./images/cover.jpg" />
  <link rel="icon" href="./images/cover.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--ivory:#f7f1ea;--paper:#fbf7f2;--blush:#e8d3cc;--rose:#b07a73;--rose-deep:#8d5c56;--ink:#3f3834;--ink-soft:#7a716a;--line:#ddcfc6;--white:#fffcf8;--shadow:0 24px 60px rgba(90,54,46,.12)}
    *{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
    body{font-family:"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 50% -10%,#f3e4dc 0%,transparent 55%),linear-gradient(180deg,#efe4db 0%,var(--ivory) 40%,#eadfd6 100%);line-height:1.7;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:rgba(176,122,115,.18)}
    img{max-width:100%;height:auto;display:block}a{color:inherit}
    .skip{position:absolute;left:12px;top:12px;transform:translateY(-160%);background:var(--white);color:var(--ink);padding:8px 12px;border-radius:999px;z-index:40}
    .skip:focus{transform:none}
    .wrap{max-width:430px;margin:0 auto;min-height:100vh;padding:18px 14px 110px}
    .card{background:var(--paper);border:1px solid rgba(176,122,115,.18);box-shadow:var(--shadow);overflow:hidden;animation:rise 900ms ease both}
    .card+.card{margin-top:18px;animation-delay:120ms}
    .card img{width:100%}
    .ornament{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--rose);padding:22px 8px 8px;animation:rise 900ms ease both}
    .ornament span{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-style:italic;letter-spacing:.28em;font-size:12px}
    .ornament i{display:block;width:42px;height:1px;background:linear-gradient(90deg,transparent,var(--rose),transparent)}
    .countdown-wrap{text-align:center;padding:4px 10px 18px}
    .countdown-label{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--rose-deep);letter-spacing:.18em;font-size:13px;margin-bottom:10px}
    .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .count-box{background:rgba(255,252,248,.72);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px}
    .count-box b{display:block;font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;color:var(--rose-deep)}
    .count-box span{display:block;margin-top:6px;font-size:10px;letter-spacing:.16em;color:var(--ink-soft)}
    .transit{padding:18px 18px 4px}
    .transit h2{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-weight:500;font-size:13px;letter-spacing:.28em;text-align:center;color:var(--rose-deep);margin-bottom:10px}
    .transit p{font-size:14px;color:var(--ink-soft);text-align:center;text-wrap:pretty}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 14px 16px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 10px;border-radius:999px;text-decoration:none;font-size:13px;letter-spacing:.04em;border:1px solid var(--rose);background:var(--rose);color:var(--white);font-family:inherit;transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease,transform 180ms ease}
    .btn.ghost{background:transparent;color:var(--rose-deep)}
    .btn:hover{background:var(--rose-deep);color:var(--white)}
    .btn:active{transform:translateY(1px)}
    .btn:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}
    footer{text-align:center;padding:22px 12px 0;color:var(--ink-soft);font-family:"Noto Serif TC",serif;letter-spacing:.18em;font-size:13px;text-wrap:balance}
    .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(402px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:20;padding:8px;background:rgba(255,252,248,.82);border:1px solid rgba(176,122,115,.22);border-radius:999px;backdrop-filter:blur(16px)}
    .dock .btn{box-shadow:0 8px 20px rgba(90,54,46,.12)}
    .seat{padding:22px 16px 18px}
    .seat h2{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-weight:500;font-size:13px;letter-spacing:.28em;text-align:center;color:var(--rose-deep);margin-bottom:6px}
    .seat .hint{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:12px}
    .seat input{width:100%;min-height:46px;border-radius:999px;border:1px solid var(--line);background:var(--white);padding:0 18px;font:inherit;font-size:16px;color:var(--ink)}
    .seat input:focus{outline:2px solid var(--rose);outline-offset:2px}
    .cands{list-style:none;margin-top:8px;display:grid;gap:6px}
    .cands button,.tbl button{width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,252,248,.72);border-radius:14px;padding:9px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
    .cands small,.tbl small{color:var(--ink-soft);font-size:12px}
    .result{margin-top:14px;border:1px solid rgba(176,122,115,.3);border-radius:18px;padding:14px;background:var(--white);text-align:center}
    .result b{display:block;font-family:"Cormorant Garamond",serif;font-size:40px;font-weight:500;color:var(--rose-deep);line-height:1.1}
    .result p{font-size:13px;color:var(--ink-soft)}
    .mates{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
    .mates span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
    .plan{position:relative;margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
    .plan .pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #c0392b;box-shadow:0 0 0 4px rgba(192,57,43,.25);animation:pulse 1.4s ease-in-out infinite;pointer-events:none}
    @keyframes pulse{50%{box-shadow:0 0 0 10px rgba(192,57,43,0)}}
    .browse{margin-top:16px}
    .browse details{border-top:1px solid var(--line);padding:8px 2px}
    .browse summary{cursor:pointer;font-size:14px;color:var(--rose-deep);list-style-position:inside}
    .tbl{margin:8px 0 4px;font-size:12px;color:var(--ink-soft)}
    .tbl div{display:grid;gap:4px;margin-top:4px}
    .dock{grid-template-columns:1fr 1fr 1fr}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @media(min-width:720px){body{padding:28px 0}.wrap{max-width:460px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.ornament{animation:none}.btn{transition:none}}
  </style>
</head>
<body>
  <a class="skip" href="#invite">跳到喜帖內容</a>
  <main class="wrap" id="invite">
    <article class="card">
      <img src="./images/cover.jpg" alt="馬躍成與楊雅婷婚紗照，VVG Food Play & Bar，2026年11月15日星期日上午11時30分" width="900" height="1269" fetchpriority="high" />
      <div class="ornament" aria-hidden="true"><i></i><span>together</span><i></i></div>
      <div class="countdown-wrap">
        <p class="countdown-label">距離我們的日子</p>
        <div class="countdown" id="countdown" aria-live="polite"></div>
      </div>
    </article>
    <article class="card">
      <img src="./images/timeline.jpg" alt="婚禮流程：十一時30分迎賓，十二時午宴，十四時30分送客" width="900" height="1269" loading="lazy" />
    </article>
    <article class="card" id="transit">
      <img src="./images/map.jpg" alt="臺中國家歌劇院五樓 VVG Food Play 位置與停車場地圖" width="900" height="1269" loading="lazy" />
      <section class="transit">
        <h2>TRAFFIC</h2>
        <p>歌劇院 B1 設有停車場，於婚禮送客時，VVG 的工作人員會在現場發放 3 小時免費停車折抵券，歡迎有需要的賓客自由領取哦！</p>
      </section>
      <div class="actions">
        <a class="btn ghost" href="https://www.npac-ntt.org/visit/transportation" target="_blank" rel="noopener">交通指南</a>
        <a class="btn" href="./nearby.html">附近好玩</a>
      </div>
    </article>
    <article class="card" id="seat">
      <section class="seat">
        <h2>FIND YOUR SEAT</h2>
        <p class="hint">輸入名字的任一字、英文名或暱稱都可以，也能直接在下方分類中找</p>
        <input id="seat-q" type="search" placeholder="例如：雅婷、Joann、韋智" autocomplete="off" aria-label="搜尋姓名" />
        <ul class="cands" id="seat-cands" aria-live="polite"></ul>
        <div id="seat-result" hidden></div>
        <div class="plan"><img src="./images/seat-map.jpg" alt="VVG 桌次平面圖：A、B、C 三個用餐區與主桌 8 號" width="804" height="1132" loading="lazy" /><i class="pin" id="seat-pin" hidden></i></div>
        <div class="browse" id="seat-browse"></div>
      </section>
    </article>
    <footer>期待與您相見</footer>
  </main>
  <nav class="dock" aria-label="快捷操作">
    <a class="btn ghost" href="#seat">座位查詢</a>
    <a class="btn ghost" href="invite.ics">加入行事曆</a>
    <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=National%20Taichung%20Theater%2C%20No.%20101%E8%99%9F%2C%20Section%202%2C%20Huilai%20Rd%2C%20Huilai%20Village%2C%20Xitun%20District%2C%20Taichung%20City%2C%20407025">前往會場</a>
  </nav>
  <script>
    const wedding=new Date("2026-11-15T11:30:00+08:00");
    const box=document.getElementById("countdown");
    function tick(){
      const diff=wedding.getTime()-Date.now();
      if(diff<0){box.innerHTML='<div class="count-box" style="grid-column:1/-1"><b>TODAY</b><span>今天</span></div>';return;}
      const parts=[Math.floor(diff/86400000),Math.floor(diff%86400000/3600000),Math.floor(diff%3600000/60000),Math.floor(diff%60000/1000)];
      const labels=["天","時","分","秒"];
      box.innerHTML=parts.map((n,i)=>`<div class="count-box"><b>${n}</b><span>${labels[i]}</span></div>`).join("");
    }
    tick();setInterval(tick,1000);
  </script>
  <script src="./seat.js"></script>
  <script>
  (function(){
    var q=document.getElementById('seat-q'),c=document.getElementById('seat-cands'),r=document.getElementById('seat-result'),pin=document.getElementById('seat-pin'),br=document.getElementById('seat-browse'),D;
    function esc(s){return String(s).replace(/[&<>"]/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]})}
    function label(g){return g.name+(g.seats>1?' 等 '+g.seats+' 位':'')}
    function tname(t){return t==8?'主桌 8':t+' 桌'}
    function pick(g){
      var mates=D.guests.filter(function(x){return x.table==g.table&&x!==g});
      r.hidden=false;r.innerHTML='<div class="result"><p>'+esc(label(g))+(g.aliases.length?'（'+esc(g.aliases.join('、'))+'）':'')+'</p><b>'+tname(g.table)+'</b><p>'+g.zone+' 用餐區・'+esc(g.cat||'')+'</p>'+(mates.length?'<div class="mates">'+mates.map(function(m){return '<span>'+esc(label(m))+'</span>'}).join('')+'</div>':'')+'</div>';
      var xy=D.coords[g.table];if(xy){pin.hidden=false;pin.style.left=xy[0]+'%';pin.style.top=xy[1]+'%'}else pin.hidden=true;
      c.innerHTML='';r.scrollIntoView({behavior:'smooth',block:'start'})}
    function btn(g,sub){var b=document.createElement('button');b.type='button';b.innerHTML='<span>'+esc(label(g))+'</span><small>'+esc(sub)+'</small>';b.onclick=function(){pick(g)};return b}
    fetch('./seats.json').then(function(x){return x.json()}).then(function(d){D=d;
      var cats={};d.guests.forEach(function(g){(cats[g.cat]=cats[g.cat]||{})[g.table]=((cats[g.cat]||{})[g.table]||[]).concat(g)});
      Object.keys(cats).forEach(function(k){var det=document.createElement('details');det.innerHTML='<summary>'+esc(k)+'</summary>';
        Object.keys(cats[k]).sort(function(a,b){return a-b}).forEach(function(t){var w=document.createElement('div');w.className='tbl';w.innerHTML=tname(t);var l=document.createElement('div');cats[k][t].forEach(function(g){l.appendChild(btn(g,g.aliases.join('、')))});w.appendChild(l);det.appendChild(w)});br.appendChild(det)});
      q.addEventListener('input',function(){c.innerHTML='';SeatSearch.search(D.guests,q.value).forEach(function(g){var li=document.createElement('li');li.appendChild(btn(g,tname(g.table)+'・'+g.cat));c.appendChild(li)});if(q.value&&!c.children.length)c.innerHTML='<li class="hint" style="font-size:13px;color:var(--ink-soft);text-align:center">找不到，試試只打一個字或從下方分類找</li>'})});
  })();
  </script>
</body>
</html>
