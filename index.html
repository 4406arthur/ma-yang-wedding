<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>馬躍成 & 楊雅婷 婚禮邀請｜2026.11.15</title>
  <meta name="description" content="2026.11.15（日）11:30｜VVG Food Play & Bar｜臺中國家歌劇院 5F" />
  <meta name="theme-color" content="#f3eee6" />
  <meta property="og:title" content="馬躍成 & 楊雅婷 婚禮邀請" />
  <meta property="og:description" content="2026.11.15（日）11:30｜VVG Food Play & Bar｜臺中國家歌劇院 5F" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./images/cover.jpg" />
  <link rel="icon" href="./images/cover.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--paper:#f4efe8;--ink:#3b3834;--ink-soft:#6b645c;--line:#c9bfb2;--white:#fffcf8;--shadow:0 14px 40px rgba(80,60,40,.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:"Noto Sans TC",sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
    img{max-width:100%;display:block}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:560px;margin:0 auto;background:var(--white);min-height:100vh;box-shadow:var(--shadow);padding-bottom:88px}
    .sheet{padding:0 0 8px}
    .sheet img{width:100%}
    .tools{padding:16px 20px 8px}
    .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .count-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px 4px 8px}
    .count-box b{display:block;font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:500;line-height:1.1}
    .count-box span{font-size:11px;color:var(--ink-soft);letter-spacing:.12em}
    .map-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:4px 20px 20px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 10px;border-radius:999px;font-size:13px;letter-spacing:.06em;border:1px solid var(--ink);background:var(--ink);color:var(--white);font-family:inherit}
    .btn.ghost{background:transparent;color:var(--ink)}
    footer{text-align:center;padding:8px 24px 20px;color:var(--ink-soft);font-size:12px;letter-spacing:.12em}
    .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:20}
    .dock .btn{box-shadow:0 10px 30px rgba(40,30,20,.18);min-height:46px}
    @media(min-width:720px){body{padding:32px 0;background:#e8e0d4}.wrap{border-radius:20px;overflow:hidden}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="sheet">
      <img src="./images/cover.jpg" alt="馬躍成與楊雅婷｜VVG Food Play & Bar｜2026.11.15 11:30" />
    </section>
    <section class="tools">
      <div class="countdown" id="countdown"></div>
    </section>
    <section class="sheet">
      <img src="./images/timeline.jpg" alt="11:30 迎賓、12:00 午宴、14:30 送客" />
    </section>
    <section class="sheet">
      <img src="./images/map.jpg" alt="臺中國家歌劇院 5F VVG Food Play 地圖" />
    </section>
    <div class="map-actions">
      <a class="btn ghost" href="tel:+886422587582">撥打電話</a>
      <a class="btn ghost" href="https://maps.apple.com/?q=%E8%87%BA%E4%B8%AD%E5%9C%8B%E5%AE%B6%E6%AD%8C%E5%8A%87%E9%99%A2&ll=24.1629258,120.6404037" target="_blank" rel="noopener">Apple 地圖</a>
      <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=24.1629258,120.6404037" target="_blank" rel="noopener">Google 導航</a>
    </div>
    <footer>期待與您相見</footer>
  </main>
  <div class="dock">
    <a class="btn ghost" href="invite.ics">加入行事曆</a>
    <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=24.1629258,120.6404037">導航前往</a>
  </div>
  <script>
    const wedding = new Date("2026-11-15T11:30:00+08:00");
    const box = document.getElementById("countdown");
    function tick() {
      const diff = wedding - Date.now();
      if (diff < 0) {
        box.innerHTML = '<div class="count-box" style="grid-column:1/-1"><b>TODAY</b><span>TODAY</span></div>';
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor(diff % 86400000 / 3600000);
      const m = Math.floor(diff % 3600000 / 60000);
      const s = Math.floor(diff % 60000 / 1000);
      box.innerHTML = [[d,"DAYS"],[h,"HRS"],[m,"MIN"],[s,"SEC"]]
        .map(([n,l]) => `<div class="count-box"><b>${n}</b><span>${l}</span></div>`).join("");
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
